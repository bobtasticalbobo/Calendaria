name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - name: Collect the app
        shell: bash
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp src-tauri/target/release/calendaria.exe out/Calendaria-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Calendaria-windows
          path: out/*.exe
      # Every build of main becomes a downloadable release.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Calendaria build ${{ github.run_number }}
          make_latest: true
          files: out/*.exe
